project:
  name: "gnn-bert-music-context"
  seed: 42

audio:
  sample_rate: 22050
  segment_seconds: 5
  n_mels: 128
  n_chroma: 12
  hop_length: 512

graph:
  similarity_threshold: 0.75
  add_temporal_edges: true
  add_similarity_edges: true

text:
  model_name: "bert-base-uncased"
  max_length: 128

training:
  batch_size: 16
  learning_rate: 0.00002
  weight_decay: 0.0001
  epochs: 5

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  splits: "data/splits"
  results: "results"
  plots: "plots"